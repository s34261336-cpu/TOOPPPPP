services:
  - type: web
    name: giftfastel-mini-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CODE_SYNC_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: data/database.db